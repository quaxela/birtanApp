# main dalına giden her commit'i Vercel'e yayınlar.
#
# Vercel'in kendi GitHub bağlantısı yerine bu var: bağlantı depo sahibi hesap
# ile Vercel hesabının aynı olmasını istiyor, burada istemiyor. Yayını yapan
# şey Vercel CLI, tetikleyen şey GitHub.
#
# Tek şart: depoda VERCEL_TOKEN adında bir Actions secret'ı olmalı.
# Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret
# Token: https://vercel.com/account/tokens

name: Vercel'e yayınla

on:
  push:
    branches: [main]
  # Elle de çalıştırılabilsin.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Bunlar gizli değil: hangi Vercel projesine yayınlanacağını söylerler.
      VERCEL_ORG_ID: team_ryzISpX5rh0NBzQ24H5pSngg
      VERCEL_PROJECT_ID: prj_OzMMCxcrfcRrUA7njmZiBajUZsao

    steps:
      - uses: actions/checkout@v4

      - name: Token var mı
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN tanımlı değil."
            echo "https://vercel.com/account/tokens adresinden bir token üretip"
            echo "depoda Settings > Secrets and variables > Actions altına"
            echo "VERCEL_TOKEN adıyla ekleyin."
            exit 1
          fi

      - name: Yayınla
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
